name: Institutional FX & Macro Pipeline (4H)

on:
  schedule:
    - cron: '15 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Macro & FX Collector Bot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_data.py

      - name: Commit & Push Updated Snapshots
        run: |
          git config user.name "fx-quant-bot[bot]"
          git config user.email "fx-quant-bot[bot]@users.noreply.github.com"
          git add public/data/fx_macro_snapshot.json public/data/fx_history.json public/data/meetings.json
          git diff --staged --quiet || git commit -m "chore(data): update macro & FX snapshot [skip ci]"
          git push

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
