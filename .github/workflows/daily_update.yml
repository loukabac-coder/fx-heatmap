name: Daily Macro & FX Data Update

on:
  schedule:
    - cron: '27 6 * * *'   # Tous les matins à 6h27 UTC (7h27/8h27 Paris)
  workflow_dispatch:       # Bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: pip install requests yfinance pandas

      - name: Lancer le robot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python update_data.py

      - name: Publier data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Mise à jour automatique des données"
          git push
