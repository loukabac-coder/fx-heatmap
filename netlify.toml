[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60, s-maxage=300, must-revalidate"
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/api/live-rates"
  to = "/.netlify/functions/live-rates"
  status = 200